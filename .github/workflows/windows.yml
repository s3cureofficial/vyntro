name: Windows-Installer

# Baut Vyntro für Windows und hängt den Installer an ein GitHub-Release.
# Auslöser: ein Tag wie v1.0.0 – oder manuell über „Run workflow“.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.14" "pyinstaller-hooks-contrib>=2025.5"

      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-test" >> "$GITHUB_OUTPUT"
          fi

      - name: Version im Code prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          code=$(python -c "from version import VERSION; print(VERSION)")
          if [ "$code" != "${{ steps.version.outputs.version }}" ]; then
            echo "version.py ($code) passt nicht zum Tag (${{ steps.version.outputs.version }})"; exit 1
          fi

      - name: Programm bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name Vyntro
          --icon branding/vyntro.ico
          --add-data "branding/vyntro-emblem.png;."
          --add-data "branding/vyntro-icon-1024.png;."
          --add-data "watchlist.txt;."
          --collect-all yfinance
          --collect-all curl_cffi
          --collect-submodules websockets
          --collect-submodules numpy
          --hidden-import matplotlib.backends.backend_qtagg
          --hidden-import app
          --hidden-import update
          --hidden-import tr_import
          --hidden-import anleitung
          --hidden-import kursbilder
          vyntro.py

      - name: Selbsttest (startet das gebaute Programm kurz und beendet es)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath "dist\Vyntro\Vyntro.exe" -ArgumentList "--selbsttest" -PassThru
          $fertig = $p.WaitForExit(120000)
          $log = "$env:APPDATA\Vyntro\selbsttest.txt"
          $absturz = "$env:APPDATA\Vyntro\absturz.txt"
          if (Test-Path $log) { Write-Host "Protokoll: $(Get-Content $log)" } else { Write-Host "kein Protokoll" }
          if (Test-Path $absturz) { Write-Host "----- Absturz -----"; Get-Content $absturz | Write-Host }
          if (-not $fertig) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "Programm hat sich nicht selbst beendet"
            exit 1
          }
          Write-Host "Exit-Code: $($p.ExitCode)"
          if (-not ((Test-Path $log) -and ((Get-Content $log) -like "ok*"))) { exit 1 }

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=${{ steps.version.outputs.version }}" windows\vyntro.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Vyntro-Setup
          path: installer/*.exe

      - name: Release mit Installer veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vyntro ${{ steps.version.outputs.version }}
          files: installer/*.exe
          body_path: NEU.md
